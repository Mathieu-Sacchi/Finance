# Serves the loan calculator at the repo's GitHub Pages URL (site root = loan_calculator/).
name: Deploy loan calculator (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "loan_calculator/**"
      - ".github/workflows/deploy-loan-calculator.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-loan-calculator
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: loan_calculator
      - id: deployment
        uses: actions/deploy-pages@v4
