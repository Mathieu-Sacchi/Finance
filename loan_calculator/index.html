<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>How much can I borrow?</h1>

    <section class="group">
      <label>Years</label>
      <div class="year-buttons" id="yearButtons">
        <button type="button" data-years="10">10</button>
        <button type="button" data-years="20">20</button>
        <button type="button" data-years="25" class="active">25</button>
        <button type="button" data-years="other">Other</button>
      </div>
      <input id="yearsInput" type="number" min="1" step="1" value="25" aria-label="Years" />
    </section>

    <section class="group">
      <label for="rateInput">Interest rate (% yearly)</label>
      <input id="rateInput" type="number" min="0" step="0.01" value="4.15" />
      <p class="hint">Current platform weighted average (simplified).</p>
    </section>

    <section class="group two-cols">
      <div>
        <label for="annuityInput">Annuity (per year)</label>
        <input id="annuityInput" type="number" min="0" step="1" value="6493" />
      </div>
      <div>
        <label for="amountInput">Loan amount</label>
        <input id="amountInput" type="number" min="0" step="1" value="100000" />
      </div>
    </section>

    <p class="result" id="result">Borrowing capacity: 100,000</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
